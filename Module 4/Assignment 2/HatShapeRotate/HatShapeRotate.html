<!DOCTYPE html>
<html lang="en">
<head>
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es
        precision highp float;
        precision highp int;

        in vec4 vPosition;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        void main()
        {
            gl_Position = projectionMatrix * modelViewMatrix * vPosition;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;
        precision highp int;

        uniform vec4 fColor;
        out vec4 fragmentColor;

        void main()
        {
            fragmentColor = fColor;
        }
    </script>

    <script type="text/javascript" src="Common/webgl-utils.js"></script>
    <script type="text/javascript" src="Common/initShaders.js"></script>
    <script type="text/javascript" src="Common/MV.js"></script>
    <script type="text/javascript" src="HatShapeRotate.js"></script>
</head>

<body>
    <p> </p>

    <canvas id="gl-canvas" width="512" height="512">
        Oops ... your browser doesn't support the HTML5 canvas element
    </canvas>

    <br />
    X Camera Position: <button id="rotateright">Rotate Right</button> <button id="rotateleft">Rotate Left</button>
    <br>
    <br />
    Y Camera Position: <button id="rotateup">Rotate Up</button> <button id="rotatedown">Rotate Down</button>
    <br>
    <br />
    Type of Perspective: <button id="ortho">Orthographic</button> <button id="perspective">Perspective</button>
    <br>


</body>
</html>
