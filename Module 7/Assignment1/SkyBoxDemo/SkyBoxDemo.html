<!DOCTYPE html>
<html lang="en">
<head>
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es
        precision highp float;
        precision highp int;

        in vec4 vPosition;

        out vec3 fTexCubeCoord;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        void main()
        {
            fTexCubeCoord = normalize(vPosition.xyz);
            gl_Position = projectionMatrix * modelViewMatrix * vPosition;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;
        precision highp int;

        in vec3 fTexCubeCoord;
        uniform samplerCube texMap;

        out vec4 fragmentColor;

        void main()
        {
            fragmentColor = texture(texMap, fTexCubeCoord);
        }
    </script>
    <script type="text/javascript" src="Common/webgl-utils.js"></script>
    <script type="text/javascript" src="Common/initShaders.js"></script>
    <script type="text/javascript" src="Common/MV.js"></script>
    <script type="text/javascript" src="SkyBoxDemo.js"></script>
</head>

<body>
    <canvas id="gl-canvas" width="512" height="512">
        Oops ... your browser doesn't support the HTML5 canvas element
    </canvas>

    <img id="cubefront" src="Images/park_front.jpg" hidden />
    <img id="cubeback" src="Images/park_back.jpg" hidden />
    <img id="cubetop" src="Images/park_top.jpg" hidden />
    <img id="cubebottom" src="Images/park_bottom.jpg" hidden />
    <img id="cubeleft" src="Images/park_left.jpg" hidden />
    <img id="cuberight" src="Images/park_right.jpg" hidden />

</body>
</html>
